name: CI — Terraform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Um plan por ref; cancela o anterior ao empurrar de novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PRs executam somente validacoes sem credenciais ou acesso ao state remoto.
permissions:
  contents: read

jobs:
  validate:
    name: fmt, validate e tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # -backend=false: valida sintaxe e contrato de outputs sem tocar em state
      # nem exigir credencial AWS. E o que roda em PR.
      - name: terraform init (sem backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: Verificar contrato W5 do collector
        shell: bash
        run: |
          grep -q 'nr-k8s-otel-collector' main.tf
          grep -q 'kubernetes_service.*nrdot_otlp_alias' main.tf || grep -q 'name      = "nr-k8s-otel-collector"' main.tf
          grep -q 'new_relic_license_key' main.tf
          grep -q 'memory_limiter' main.tf
          grep -q 'retry_on_failure' main.tf
          if grep -RniE 'licenseKey[[:space:]]*=[[:space:]]*"(NRAK-|eyJ)' --include='*.tf' --include='*.yaml' .; then
            echo '::error::Chave New Relic literal detectada no repositorio.'
            exit 1
          fi

      - name: tfsec
        uses: docker://aquasec/tfsec:v1.28.14
        with:
          args: --soft-fail . # W1: reporta sem bloquear. Vira bloqueante na W6.
