name: CI — Terraform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Um plan por ref; cancela o anterior ao empurrar de novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PRs executam somente validacoes sem credenciais ou acesso ao state remoto.
permissions:
  contents: read

jobs:
  validate:
    name: fmt, validate e tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # -backend=false: valida sintaxe e contrato de outputs sem tocar em state
      # nem exigir credencial AWS. E o que roda em PR.
      - name: terraform init (sem backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: tfsec
        uses: docker://aquasec/tfsec:v1.28.14
        with:
          args: --soft-fail . # W1: reporta sem bloquear. Vira bloqueante na W6.
